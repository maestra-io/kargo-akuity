name: CI

on:
  pull_request:
    branches-ignore:
    - newdocs
  merge_group:
  push:
    branches:
    - main
    - release-*

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Run unit tests
      run: make test-unit
    - name: Remove generated code from report
      run: |
        for report in $(find . -maxdepth 4 -type f -name 'coverage.txt'); do
          tmp_file=$(dirname $report)/coverage.tmp
          grep -v .pb.go $report | grep -v zz_ | grep -v .connect.go | grep -v 'pkg/x/client/generated/' > $tmp_file
          mv $tmp_file $report
        done
    - name: Upload coverage reports
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  
  lint-and-typecheck-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for nora (packages.maestra.io)
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install nodejs
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.15.0"
    # pnpm itself and npm packages through nora (packages.maestra.io, 3-day hold,
    # issues-maestra#1649): registry and token in a step-only userconfig, which pnpm reads
    # like npm. pnpm comes from nora with npm, at the version ui/package.json pins.
    - name: nora session token
      id: nora
      uses: maestra-io/github-actions/nora-session@b23cf64c53b689f5ae98b08bac884cf1ffc1b3c1 # v1.78.1
    - name: Install pnpm
      id: pnpm
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: |
        # npm and pnpm expand ${NORA_TOKEN} at run time; the token is never written to disk.
        # shellcheck disable=SC2016
        printf '%s\n' 'registry=https://packages.maestra.io/npm/' '//packages.maestra.io/npm/:_authToken=${NORA_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
        npm install --global "$(jq -r .packageManager ui/package.json)"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - name: Run typecheck
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: make typecheck-ui
    - name: Run linter
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: make lint-ui
    - name: Run unit tests
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: make test-unit-ui

  lint-go:
    permissions:
      contents: read # Permissions to read the repository, required because we override the default permissions
      checks: write # Used to create checks (linting comments) on PRs
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Cache golangci-lint
      id: cache-golangci-lint
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          hack/bin/golangci-lint
          hack/bin/golangci-lint-*
        key: ${{ runner.os }}-golangci-lint-${{ hashFiles('hack/tools.mk') }}
    - name: Install golangci-lint
      if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
      run: make install-golangci-lint
    - name: Run linter
      run: make lint-go

  lint-charts:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Cache helm
      id: cache-helm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          hack/bin/helm
          hack/bin/helm-*
        key:
          ${{ runner.os }}-helm-${{ hashFiles('go.mod', 'hack/tools.mk') }}
    - name: Install helm
      if: steps.cache-helm.outputs.cache-hit != 'true'
      run: make install-helm
    - name: Run linter
      run: make lint-charts

  test-chart:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Cache helm
      id: cache-helm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          hack/bin/helm
          hack/bin/helm-*
        key:
          ${{ runner.os }}-helm-${{ hashFiles('go.mod', 'hack/tools.mk') }}
    - name: Install helm
      if: steps.cache-helm.outputs.cache-hit != 'true'
      run: make install-helm
    - name: Run chart unit tests
      run: |
        set -o pipefail
        make test-chart 2>&1 | tee /tmp/chart-tests.log
    - name: Publish chart test summary
      if: always()
      run: |
        [ -f /tmp/chart-tests.log ] || exit 0
        {
          echo '## Chart unit tests'
          echo '```'
          sed -n '/^### Chart/,$p' /tmp/chart-tests.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  check-codegen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for nora (packages.maestra.io)
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Install java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "21"
        java-package: jre
    - name: Install nodejs
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.15.0"
    # pnpm itself and npm packages through nora (packages.maestra.io, 3-day hold,
    # issues-maestra#1649): registry and token in a step-only userconfig, which pnpm reads
    # like npm. pnpm comes from nora with npm, at the version ui/package.json pins.
    - name: nora session token
      id: nora
      uses: maestra-io/github-actions/nora-session@b23cf64c53b689f5ae98b08bac884cf1ffc1b3c1 # v1.78.1
    - name: Install pnpm
      id: pnpm
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: |
        # npm and pnpm expand ${NORA_TOKEN} at run time; the token is never written to disk.
        # shellcheck disable=SC2016
        printf '%s\n' 'registry=https://packages.maestra.io/npm/' '//packages.maestra.io/npm/:_authToken=${NORA_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
        npm install --global "$(jq -r .packageManager ui/package.json)"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - name: Install nodejs dependencies
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: pnpm install --dev
      working-directory: ./ui
    - name: Cache tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          hack/bin
          hack/include
        key: ${{ runner.os }}-tools-${{ hashFiles('hack/tools.mk') }}
    - name: Run Codegen
      # make codegen runs npm install -g and pnpm install for ui/ and docs/: through nora too.
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/nora.npmrc
      run: make codegen
    - name: Check nothing has changed
      run: git diff --exit-code -- .

  build-image:
    needs: [test-unit, lint-go, lint-charts, lint-and-typecheck-ui, check-codegen]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for nora (packages.maestra.io)
    services:
      registry:
        image: registry:3.0.0
        ports:
        - 5000:5000
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    # BuildKit pulls the base images through nora (packages.maestra.io, issues-maestra#1649)
    # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
    # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
    # maestra-io/github-actions.
    - name: nora docker credentials
      env:
        AUDIENCE: packages.maestra.io
        PACKAGES_URL: https://packages.maestra.io
      run: |
        # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
        bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
        # The helper runs in the caller's environment, which tox and other test runners
        # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
        ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
          "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
        cat > "$bin/docker-credential-nora" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        [ "${1:-}" = get ] || exit 0
        server=$(cat) # docker sends it without a newline
        . "${BASH_SOURCE[0]%/*}/oidc.env"
        t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
          "$url&audience=$aud" | jq -r '.value // empty')
        [ -n "$t" ]
        jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
        EOF
        chmod 755 "$bin/docker-credential-nora"
        echo "$bin" >> "$GITHUB_PATH"
        host="${PACKAGES_URL#*://}"; host="${host%%/*}"
        cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
        [ -s "$cfg" ] || echo '{}' > "$cfg"
        jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
        # <<< nora-cred-helper

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      with:
        driver-opts: network=host
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build base image
      run: |
        BASE_IMAGE=localhost:5000/kargo-base make build-base-image
        docker push localhost:5000/kargo-base:latest-amd64
    # BuildKit secret PRIVATE_PACKAGES_TOKEN: the GitHub OIDC token nora takes for
    # packages in the build (issues-maestra#1649); it lives minutes, minted right before.
    - name: mint packages token
      id: nora
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const t = await core.getIDToken('packages.maestra.io');
          core.setSecret(t);
          core.setOutput('token', t);
    - name: Build final image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        secrets: |
          PRIVATE_PACKAGES_TOKEN=${{ steps.nora.outputs.token }}
        # Maestra: linux/amd64 only, like release-maestra.yaml -- every Maestra
        # cluster is x86-64, and the arm64 leg ran under QEMU emulation for most
        # of the job's wall time.
        platforms: linux/amd64
        build-args: |
          BASE_IMAGE=localhost:5000/kargo-base
        # Push to the job-local registry service (nothing leaves the runner)
        # so the built image can be scanned for CVEs below.
        tags: localhost:5000/kargo:scan
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Install Grype
      id: grype
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        cache-db: true
    # cve-scan.sh re-stamps the VEX product @id to the scanned digest, which it
    # resolves from the job-local registry tag via crane.
    - name: Install Crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
    - name: Scan image for CVEs
      env:
        GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        GRYPE_REGISTRY_INSECURE_USE_HTTP: "true" # job-local registry service
        CRANE_INSECURE: "true" # job-local registry is plain HTTP
        VEX_IMAGE: kargo-oss # monitored image name for the VEX lookup
        FAIL_ON: "" # report-only; set to "high" to enforce
      run: ./hack/cve-scan.sh "registry:localhost:5000/kargo:scan"

  build-cli:
    needs: [test-unit, lint-go, lint-charts, lint-and-typecheck-ui, check-codegen]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Build CLI
      env:
        GOFLAGS: -buildvcs=false
      run: make build-cli
