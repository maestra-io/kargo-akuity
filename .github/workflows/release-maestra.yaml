name: Release (Maestra)

# Builds the Kargo container image with Maestra patches on top of an upstream
# tag and publishes it to the Maestra ECR. Triggered by pushing a tag of the
# form vX.Y.Z-maestra.N (matching the upstream tag the patches sit atop).
#
# Pushes to the us-west-2 registry: eu-central-1 was decommissioned on
# 2026-09-08 (maestra-io/issues-maestra#1354, phase 7) and writes there are
# denied outright by the EcrEuCentral1WriteFreeze IAM policy.
#
# Authenticates to ECR via the Teleport workload identity bot registered in
# maestra-io/fluxcd as `image-push-github-actions-kargo-akuity` -- no static
# AWS credentials are stored in this repo.

on:
  push:
    tags:
      - 'v*-maestra.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: kargo
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-kargo-akuity
  AWS_ROLE_ARN: arn:aws:iam::515260921971:role/teleport-image-push

jobs:
  publish-image:
    runs-on: runs-on=${{ github.run_id }}/pool=build
    services:
      registry:
        image: registry:3.0.0
        ports:
          - 5000:5000
    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${TELEPORT_FQDN}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF
          version: v2
          proxy_server: ${TELEPORT_FQDN}
          onboarding:
            join_method: github
            token: ${TELEPORT_TOKEN}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF

          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml || true
          test -f /tmp/tbot-output/jwt_svid

          pip install -q awscli
          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${AWS_ROLE_ARN}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"

          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login "${ECR_REGISTRY}" --username AWS --password-stdin

          aws ecr describe-repositories --repository-names "${ECR_REPO}" --region "${AWS_REGION}" 2>/dev/null || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --region "${AWS_REGION}"

      # BuildKit pulls the base images through nora (packages.maestra.io, issues-maestra#1649)
      # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
      # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
      # maestra-io/github-actions.
      - name: nora docker credentials
        env:
          AUDIENCE: packages.maestra.io
          PACKAGES_URL: https://packages.maestra.io
        run: |
          # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
          bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
          # The helper runs in the caller's environment, which tox and other test runners
          # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
          ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
          cat > "$bin/docker-credential-nora" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          server=$(cat) # docker sends it without a newline
          . "${BASH_SOURCE[0]%/*}/oidc.env"
          t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
            "$url&audience=$aud" | jq -r '.value // empty')
          [ -n "$t" ]
          jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
          EOF
          chmod 755 "$bin/docker-credential-nora"
          echo "$bin" >> "$GITHUB_PATH"
          host="${PACKAGES_URL#*://}"; host="${host%%/*}"
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
          # <<< nora-cred-helper

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build base image
        # Upstream's release flow: build kargo-base via apko, push to a
        # localhost registry, then have the main Dockerfile consume it via
        # --build-arg BASE_IMAGE. See akuity/kargo .github/workflows/release.yaml.
        run: |
          BASE_IMAGE=localhost:5000/kargo-base make build-base-image
          docker push localhost:5000/kargo-base:latest-amd64

      # BuildKit secret PRIVATE_PACKAGES_TOKEN: the GitHub OIDC token nora takes for
      # packages in the build (issues-maestra#1649); it lives minutes, minted right before.
      - name: mint packages token
        id: nora
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.setOutput('token', t);
      - name: Build and push final image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          secrets: |
            PRIVATE_PACKAGES_TOKEN=${{ steps.nora.outputs.token }}
          # linux/amd64 only: every Maestra cluster is x86-64, and the arm64
          # build ran under QEMU emulation for most of the job's wall time.
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=localhost:5000/kargo-base
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_TREE_STATE=clean
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # The login step's JWT-SVID lives 5 minutes (Teleport default) and the
      # build outlasts it; the SBOM pull needs fresh AWS credentials.
      - name: Refresh the Teleport JWT for signing
        continue-on-error: true
        run: tbot start -c /tmp/tbot.yaml

      # Keyless cosign signature + CycloneDX SBOM attestation (issues-maestra#1648).
      # The tbot JWT is exported only inside the login step; hand it to aws here.
      - name: Sign and attest the image
        uses: maestra-io/github-actions/sign-image@be3edebf65de183a5a0c3b02bcc0cd064198cdf5 # v1.62.4
        env:
          AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/tbot-output/jwt_svid
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}
          digest: ${{ steps.push.outputs.digest }}
