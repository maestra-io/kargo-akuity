name: Set up Go
description: >-
  Installs Go and restores the module and build caches.
inputs:
  go-version:
    description: The Go version to install
    required: false
    default: "1.27.3"
runs:
  using: composite
  steps:
  # setup-go caches GOMODCACHE and GOCACHE by default, keyed on a hash of
  # every go.sum in the repository.
  - name: Set up Go
    uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
    with:
      go-version: ${{ inputs.go-version }}
