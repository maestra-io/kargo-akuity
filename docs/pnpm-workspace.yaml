allowBuilds:
  '@parcel/watcher': true
  core-js: false

# docusaurus-plugin-llms pins these exactly, and both pinned versions carry
# advisories (minimatch ReDoS, yaml stack overflow). Its dependents accept
# newer patch releases, so lift them to the patched versions.
overrides:
  minimatch@9.0.3: ^9.0.9
  yaml@2.8.1: ^2.9.0
  # @docusaurus/core wants tinypool ^1.0.2 and 1.x carries two critical
  # advisories with no 1.x fix. Its only use is the optional SSG worker pool.
  tinypool@1.1.1: ^2.1.2
